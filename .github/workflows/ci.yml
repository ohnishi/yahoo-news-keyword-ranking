name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # internal/analyze/mecab は cgo で libmecab にリンクするため、
      # ヘッダとライブラリが必要（辞書は実行時にのみ必要なので入れない）。
      - name: Install MeCab
        run: |
          sudo apt-get update
          sudo apt-get install -y mecab libmecab-dev

      # go-mecab は #cgo ディレクティブを持たないため、MeCab の位置を
      # 明示的に渡さないとリンク時に undefined reference になる。
      - name: Configure cgo flags for MeCab
        run: |
          mecab-config --version
          echo "CGO_LDFLAGS=$(mecab-config --libs)" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-I$(mecab-config --inc-dir)" >> "$GITHUB_ENV"

      - name: Check formatting
        run: |
          diff=$(gofmt -s -l .)
          if [ -n "$diff" ]; then
            echo "gofmt -s needed for:"
            echo "$diff"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
